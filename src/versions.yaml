    time: "02:00"
    airport_icao: UGTB

  - name: nuit-degage
    time: "02:00"
    weather:
      temperature: 18.0
      wind_speed: 3.0
      wind_direction: 90.0
      visibility: 40000
      cloud_type: "clear"
      fog_enabled: false

  - name: nuit-epars
    time: "02:00"
    metar: "METAR UGTB 291200Z 09008KT 9999 SCT040 SCT090 18/12 Q1013"

  - name: nuit-pluie
    time: "02:00"
