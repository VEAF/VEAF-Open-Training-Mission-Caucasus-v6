# mission.yaml — generated by `veaf-tools prepare`. Edit freely.
# Run `veaf-tools validate` to check it, then `veaf-tools build`.

# ── Guide rapide de syntaxe YAML ────────────────────────────────────────────
# Indentation : espaces uniquement (pas de tabulations). Chaque niveau = 2 espaces.
# Guillemets : uniquement si la valeur contient  :  #  {  [  ou commence par un chiffre.
#   name: Mon-Vol-01            # OK — pas de guillemets
#   name: "Vol: Aller-Retour"   # obligatoire — contient :
#   Aussi obligatoires si la valeur contient des séquences d'échappement comme  \n  \t
#   briefing: "Intercept bandits\nRTB when done"  # obligatoire — contient \n
# Texte multiligne : utilisez  |  (bloc littéral) — chaque ligne suivante indentée de 2 espaces supplémentaires.
#   briefing: |
#     deuxième ligne
# Listes : chaque élément sur sa propre ligne, précédé de  -
#   groups:
#     - MIG-29_SOLO
#     - MIG-21_SOLO
# Booléens : true / false  (sans guillemets)
# Valeur vide (modules obligatoires) : MODULE:   (rien après le deux-points)
# ────────────────────────────────────────────────────────────────────────────

# ── Niveau de log global ─────────────────────────────────────────────────────
# Force tous les loggers VEAF à ce niveau. Supprimer ou mettre 'info' en production.
# Valeurs : error | warning | info | debug | trace
# Doc : https://veaf.github.io/documentation/dev/mission-maker/GUIDE/#debug-logging
global_log_level: info

# ── Mission ──────────────────────────────────────────────────────────────────
mission:
