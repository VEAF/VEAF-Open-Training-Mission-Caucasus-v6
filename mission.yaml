  # en a une vivante (vérifiée le 28/09/2026). RealWeather (DCSServerBot) lit ce code.
  name: VEAF_OpenTraining_Caucasus_ICAO_UGTB
  era: MODERN
  language: fr
  silence_atc_on_all_airbases: true
  hide_names_from_spawned_groups: true

